name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:43

    steps:
      - name: Install dependencies
        run: |
          dnf install -y git gcc-c++ cmake extra-cmake-modules \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kirigami-devel kf6-ki18n-devel kf6-kcoreaddons-devel \
            kf6-kpackage-devel libplasma-devel plasma-workspace-devel \
            systemd-devel python3 tar gzip

      - uses: actions/checkout@v4

      - name: Trust checkout directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree

      - name: Validate physical profiles
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/validate_profiles.py

      - name: Configure
        run: cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check generated diff
        run: git diff --check

      - name: Package CLI binary
        run: |
          mkdir -p build/dist
          cp build/src/cli/whatcable-linux build/dist/
          cp LICENSE build/dist/
          cd build/dist
          tar czf ../whatcable-linux-cli-${GITHUB_REF_NAME}-x86_64.tar.gz whatcable-linux LICENSE

      - name: Package Plasmoid (KPackage for kpackagetool6)
        run: |
          cd build/pkg
          tar czf ../usbeekeeper-plasmoid-${GITHUB_REF_NAME}.tar.gz io.github._2crazy4nick.usbeekeeper/

      - name: Package QML plugin (required for Plasmoid runtime)
        run: |
          cd build/qml
          tar czf ../usbeekeeper-qml-plugin-${GITHUB_REF_NAME}-x86_64.tar.gz \
            io/github/_2crazy4nick/usbeekeeper/libusbeekeeper-plasmoid-plugin.so \
            io/github/_2crazy4nick/usbeekeeper/qmldir \
            io/github/_2crazy4nick/usbeekeeper/LICENSE

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            build/whatcable-linux-cli-*.tar.gz
            build/usbeekeeper-plasmoid-*.tar.gz
            build/usbeekeeper-qml-plugin-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Release Assets

            | File | Description |
            |------|-------------|
            | `whatcable-linux-cli-${{ github.ref_name }}-x86_64.tar.gz` | Legacy standalone sysfs/libudev CLI. Extract and run `./whatcable-linux`. |
            | `usbeekeeper-plasmoid-${{ github.ref_name }}.tar.gz` | USBeeKeeper KDE Plasma 6 widget package. Install with `kpackagetool6 -t Plasma/Applet -i io.github._2crazy4nick.usbeekeeper`. |
            | `usbeekeeper-qml-plugin-${{ github.ref_name }}-x86_64.tar.gz` | QML plugin required by USBeeKeeper. Extract into the Qt 6 QML import root reported by `qtpaths6`. |

            ### Quick install (Plasmoid)

            ```bash
            # Install the QML plugin (required once)
            qt_qml_dir="$(qtpaths6 --query QT_INSTALL_QML)"
            sudo tar xzf usbeekeeper-qml-plugin-${{ github.ref_name }}-x86_64.tar.gz -C "$qt_qml_dir"

            # Install the Plasmoid
            tar xzf usbeekeeper-plasmoid-${{ github.ref_name }}.tar.gz
            kpackagetool6 -t Plasma/Applet -i io.github._2crazy4nick.usbeekeeper
            ```

            ### Quick install (legacy CLI only)

            ```bash
            tar xzf whatcable-linux-cli-${{ github.ref_name }}-x86_64.tar.gz
            sudo mv whatcable-linux /usr/local/bin/
            ```
          files: |
            assets/**/*.tar.gz
